<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      document.documentElement.classList.add('js');
      // Deep link to a sheet: the page is not painted at the top while it is being positioned
      // (the script at the end of the document scrolls it to the sheet and reveals it; 1.5 s cap).
      if (/^#sheet-\d{3}$/.test(location.hash)) {
        document.documentElement.style.visibility = 'hidden';
        setTimeout(function () { document.documentElement.style.visibility = ''; }, 1500);
      }
    </script>
